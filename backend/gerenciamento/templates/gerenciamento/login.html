<!DOCTYPE html>
<html>
<head><title>Login</title></head>
<body>
    <h1>Login</h1>
    <form method="post">
        {% csrf_token %}
        <label>Usuario: <input type="text" name="username" required></label><br><br>
        <label>Senha: <input type="password" name="password" required></label><br><br>
        <button type="submit">Entrar</button>
    </form>
</body>
</html>
